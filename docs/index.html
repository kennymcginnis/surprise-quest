<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Searchable Surprise Quest meeting minutes and transcripts" />
    <title>Surprise Quest Meeting Notes</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: 'Surprise Quest Meeting Notes',
        loadSidebar: true,
        subMaxLevel: 2,
        search: 'auto',
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
